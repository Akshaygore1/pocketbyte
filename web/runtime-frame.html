<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PocketByte runtime</title>
    <style>
      html, body { height: 100%; margin: 0; background: #101820; color: #eef6ff; font-family: system-ui, sans-serif; }
      #fixture { display: grid; grid-template-rows: 1fr auto; height: 100%; text-align: center; }
      #engine { border: 0; height: 100%; width: 100%; }
      #status { margin: 0; padding: 0.5rem; }
    </style>
  </head>
  <body>
    <div id="fixture" hidden>
      <iframe id="engine" title="PocketByte runtime powered by FreeJ2ME-Web and CheerpJ"></iframe>
      <p id="status">Redistributable smoke fixture</p>
    </div>
    <script type="module">
      const SHELL_SOURCE = "handset-shell";
      const FRAME_SOURCE = "freej2me-runtime-frame";
      let session = null;
      let fixture = null;
      let midlet = null;
      let launchKind = null;
      let launchUrl = null;
      let dataOperation = null;
      let readinessTimer = null;
      let resolutionObservationTimer = null;
      let removeObservationInputListeners = null;
      let launchHadUserInput = false;
      const post = (type, details = {}) => parent.postMessage({ source: FRAME_SOURCE, session, type, ...details }, location.origin);

      const engine = document.querySelector("#engine");
      const status = document.querySelector("#status");

      window.handsetAudio = {
        initialize() {
          const controls = engine.contentWindow?.handsetAudio;
          if (!controls) {
            return Promise.reject(
              new Error("Audio is still loading. Try again in a moment."),
            );
          }
          return controls.initialize();
        },
        setMuted(muted) {
          engine.contentWindow?.handsetAudio?.setMuted(Boolean(muted));
        },
      };

      const stopReadinessCheck = () => {
        if (readinessTimer !== null) clearInterval(readinessTimer);
        readinessTimer = null;
      };

      const stopResolutionObservation = () => {
        if (resolutionObservationTimer !== null) {
          clearInterval(resolutionObservationTimer);
        }
        resolutionObservationTimer = null;
        removeObservationInputListeners?.();
        removeObservationInputListeners = null;
      };

      const observeLaunchInput = () => {
        removeObservationInputListeners?.();
        const engineDocument = engine.contentDocument;
        const stopForInput = () => {
          launchHadUserInput = true;
          stopResolutionObservation();
        };
        const inputEvents = ["keydown", "mousedown", "pointerdown", "touchstart"];
        inputEvents.forEach((type) =>
          engineDocument?.addEventListener(type, stopForInput, {
            capture: true,
            passive: true,
          }),
        );
        removeObservationInputListeners = () => inputEvents.forEach((type) =>
          engineDocument?.removeEventListener(type, stopForInput, true),
        );
      };

      const sameOrientation = (left, right) =>
        (left.width <= left.height) === (right.width <= right.height);

      const pixelDiffers = (pixels, offset, reference) =>
        Math.abs(pixels[offset] - reference[0]) > 3
        || Math.abs(pixels[offset + 1] - reference[1]) > 3
        || Math.abs(pixels[offset + 2] - reference[2]) > 3
        || Math.abs(pixels[offset + 3] - reference[3]) > 3;

      const imageHasMeaningfulContent = (image) => {
        const { data, width, height } = image;
        const referenceOffset = ((height - 1) * width + width - 1) * 4;
        const reference = [
          data[referenceOffset],
          data[referenceOffset + 1],
          data[referenceOffset + 2],
          data[referenceOffset + 3],
        ];
        const sampleStep = 4;
        const minimumDifferences = Math.max(
          16,
          Math.floor((width * height) / (sampleStep * sampleStep) * 0.001),
        );
        let differences = 0;
        for (let y = 0; y < height; y += sampleStep) {
          for (let x = 0; x < width; x += sampleStep) {
            if (pixelDiffers(data, (y * width + x) * 4, reference)) {
              differences += 1;
              if (differences >= minimumDifferences) return true;
            }
          }
        }
        return false;
      };

      const candidateMatchesRenderedBounds = (image, candidate) => {
        const { data, width, height } = image;
        const referenceOffset = ((height - 1) * width + width - 1) * 4;
        const reference = [
          data[referenceOffset],
          data[referenceOffset + 1],
          data[referenceOffset + 2],
          data[referenceOffset + 3],
        ];
        let outsidePixels = 0;
        let outsideDifferences = 0;
        let insideDifferences = 0;
        const edgeDifferences = { top: 0, right: 0, bottom: 0, left: 0 };
        const edgeDepth = Math.max(
          2,
          Math.min(4, Math.floor(Math.min(candidate.width, candidate.height) * 0.015)),
        );

        for (let y = 0; y < height; y += 1) {
          for (let x = 0; x < width; x += 1) {
            const differs = pixelDiffers(data, (y * width + x) * 4, reference);
            if (x >= candidate.width || y >= candidate.height) {
              outsidePixels += 1;
              if (differs) outsideDifferences += 1;
              continue;
            }
            if (!differs) continue;
            insideDifferences += 1;
            if (y < edgeDepth) edgeDifferences.top += 1;
            if (x >= candidate.width - edgeDepth) edgeDifferences.right += 1;
            if (y >= candidate.height - edgeDepth) edgeDifferences.bottom += 1;
            if (x < edgeDepth) edgeDifferences.left += 1;
          }
        }

        const maximumOutsideNoise = Math.max(2, outsidePixels * 0.0005);
        const minimumInteriorContent = Math.max(
          64,
          candidate.width * candidate.height * 0.005,
        );
        const minimumHorizontalEdgeContent = Math.max(3, candidate.width * 0.01);
        const minimumVerticalEdgeContent = Math.max(3, candidate.height * 0.01);
        return outsideDifferences <= maximumOutsideNoise
          && insideDifferences >= minimumInteriorContent
          && edgeDifferences.top >= minimumHorizontalEdgeContent
          && edgeDifferences.bottom >= minimumHorizontalEdgeContent
          && edgeDifferences.left >= minimumVerticalEdgeContent
          && edgeDifferences.right >= minimumVerticalEdgeContent;
      };

      const startResolutionObservation = (canvas) => {
        stopResolutionObservation();
        if (
          launchKind !== "midlet"
          || !midlet?.automaticSizing
          || midlet.rotation !== "none"
          || launchHadUserInput
        ) {
          return;
        }

        const candidates = midlet.supportedResolutions
          .filter((candidate) =>
            Number.isInteger(candidate.width)
            && Number.isInteger(candidate.height)
            && candidate.width <= canvas.width
            && candidate.height <= canvas.height
            && (candidate.width < canvas.width || candidate.height < canvas.height)
            && sameOrientation(candidate, {
              width: canvas.width,
              height: canvas.height,
            }),
          )
          .sort((left, right) =>
            left.width * left.height - right.width * right.height,
          );
        if (candidates.length === 0) return;

        observeLaunchInput();

        const waitingStartedAt = performance.now();
        let renderingStartedAt = null;
        let stableValue = null;
        let stableSamples = 0;
        resolutionObservationTimer = setInterval(() => {
          const now = performance.now();
          if (launchHadUserInput || now - waitingStartedAt > 60_000) {
            stopResolutionObservation();
            return;
          }

          let image;
          try {
            image = canvas.getContext("2d", { willReadFrequently: true })
              ?.getImageData(0, 0, canvas.width, canvas.height);
          } catch {
            stopResolutionObservation();
            return;
          }
          if (!image) return;
          if (renderingStartedAt === null) {
            if (!imageHasMeaningfulContent(image)) return;
            renderingStartedAt = now;
          } else if (now - renderingStartedAt > 1_500) {
            stopResolutionObservation();
            return;
          }

          const match = candidates.find((candidate) =>
            candidateMatchesRenderedBounds(image, candidate),
          );
          const matchedResolutionKey = match
            ? `${match.width}x${match.height}`
            : null;
          if (matchedResolutionKey && matchedResolutionKey === stableValue) {
            stableSamples += 1;
          } else {
            stableValue = matchedResolutionKey;
            stableSamples = matchedResolutionKey ? 1 : 0;
          }
          if (match && stableSamples >= 4) {
            stopResolutionObservation();
            post("runtime-resolution-suggested", {
              identity: midlet.identity,
              resolution: { width: match.width, height: match.height },
            });
          }
        }, 150);
      };

      const releaseLaunchUrl = () => {
        if (launchUrl) URL.revokeObjectURL(launchUrl);
        launchUrl = null;
      };

      const waitForRenderedLaunch = () => {
        stopReadinessCheck();
        observeLaunchInput();
        const startedAt = Date.now();
        readinessTimer = setInterval(() => {
          const canvas = engine.contentDocument?.querySelector("#display");
          const pixel = canvas?.getContext("2d")?.getImageData(0, 0, 1, 1).data;
          const renderedCanvas = canvas?.localName === "canvas"
            && canvas.style.display !== "none"
            && canvas.width > 0
            && canvas.height > 0;
          const rendered = launchKind === "fixture"
            ? renderedCanvas
              && pixel?.[0] === 0x17
              && pixel?.[1] === 0x30
              && pixel?.[2] === 0x4a
              && pixel?.[3] === 0xff
            : renderedCanvas;

          if (rendered) {
            stopReadinessCheck();
            engine.setAttribute(
              "aria-label",
              `${fixture.name} rendered`,
            );
            status.textContent = fixture.name;
            post("running", { fixtureName: fixture.name });
            startResolutionObservation(canvas);
          } else if (Date.now() - startedAt > 60_000) {
            stopReadinessCheck();
            post("failed", {
              stage: launchKind === "fixture" ? "launching" : "execution",
              message: `${fixture.name} did not render in time.`,
            });
          }
        }, 100);
      };

      const launchFixture = () => {
        stopResolutionObservation();
        launchHadUserInput = false;
        launchKind = "fixture";
        midlet = null;
        document.querySelector("#fixture").hidden = false;
        engine.removeAttribute("aria-label");
        status.textContent = "Loading FreeJ2ME-Web and CheerpJ…";
        engine.src = `/run.html?jar=runtime-smoke.jar&audioFixture=1&fractionScale=1&shellControls=1&launch=${Date.now()}`;
        engine.addEventListener("load", waitForRenderedLaunch, { once: true });
      };

      const launchMidlet = (selectedMidlet) => {
        stopResolutionObservation();
        launchHadUserInput = false;
        launchKind = "midlet";
        midlet = selectedMidlet;
        fixture = { name: midlet.name };
        releaseLaunchUrl();
        launchUrl = URL.createObjectURL(
          new Blob([midlet.jarBytes], { type: "application/java-archive" }),
        );
        document.querySelector("#fixture").hidden = false;
        engine.removeAttribute("aria-label");
        status.textContent = `Loading the runtime for ${midlet.name}…`;
        const query = new URLSearchParams({
          launchUrl,
          identity: midlet.identity,
          main: midlet.className,
          name: midlet.name,
          width: String(midlet.resolution.width),
          height: String(midlet.resolution.height),
          rotation: midlet.rotation,
          muted: midlet.muted ? "1" : "0",
          fractionScale: "1",
          shellControls: "1",
          launch: String(Date.now()),
        });
        engine.src = `/run.html?${query}`;
        engine.addEventListener("load", waitForRenderedLaunch, { once: true });
      };

      const manageGameData = (command) => {
        stopReadinessCheck();
        stopResolutionObservation();
        launchHadUserInput = false;
        releaseLaunchUrl();
        launchKind = "data-operation";
        fixture = null;
        midlet = null;
        dataOperation = {
          action: command.action,
          requestId: command.requestId,
        };
        document.querySelector("#fixture").hidden = false;
        engine.removeAttribute("aria-label");
        status.textContent = command.action === "clear"
          ? "Clearing saved progress…"
          : "Removing local game data…";
        const query = new URLSearchParams({
          operation: command.action === "clear" ? "clear-game-data" : "remove-game",
          identity: command.identity,
          requestId: command.requestId,
          launch: String(Date.now()),
        });
        engine.src = `/run.html?${query}`;
      };

      window.addEventListener("message", (event) => {
        if (event.origin !== location.origin || event.source !== engine.contentWindow) return;
        const message = event.data;
        if (!message || message.source !== "freej2me-engine") return;
        if (message.type === "launch-consumed") releaseLaunchUrl();
        if (
          message.type === "operation-complete"
          && dataOperation
          && message.requestId === dataOperation.requestId
        ) {
          post("game-data-operation-complete", {
            requestId: dataOperation.requestId,
          });
          dataOperation = null;
          engine.src = "about:blank";
          document.querySelector("#fixture").hidden = true;
          return;
        }
        if (message.type === "launching") {
          post("launching", { fixtureName: fixture.name });
        }
        if (message.type === "media-warning") {
          post("media-warning", { message: message.message });
        }
        if (message.type === "failed") {
          stopReadinessCheck();
          stopResolutionObservation();
          if (dataOperation) {
            post("game-data-operation-failed", {
              requestId: dataOperation.requestId,
              message: message.message,
            });
            dataOperation = null;
            engine.src = "about:blank";
            document.querySelector("#fixture").hidden = true;
            return;
          }
          post("failed", { stage: message.stage, message: message.message });
        }
      });

      window.addEventListener("message", (event) => {
        if (event.origin !== location.origin || event.source !== parent) return;
        const command = event.data;
        if (!command || command.source !== SHELL_SOURCE || typeof command.session !== "string") return;
        session = command.session;
        if (command.type === "initialize") post("runtime-ready");
        if (command.type === "launch" && command.fixture?.id === "smoke-fixture") {
          fixture = command.fixture;
          post("launching", { fixtureName: fixture.name });
          launchFixture();
        }
        if (
          command.type === "launch-midlet"
          && command.midlet?.jarBytes
          && typeof command.midlet.identity === "string"
          && typeof command.midlet.name === "string"
          && typeof command.midlet.className === "string"
          && Number.isInteger(command.midlet.resolution?.width)
          && Number.isInteger(command.midlet.resolution?.height)
          && typeof command.midlet.automaticSizing === "boolean"
          && Array.isArray(command.midlet.supportedResolutions)
          && command.midlet.supportedResolutions.every((resolution) =>
            Number.isInteger(resolution?.width)
            && Number.isInteger(resolution?.height)
            && resolution.width > 0
            && resolution.height > 0
          )
          && (command.midlet.rotation === "none"
            || command.midlet.rotation === "counterclockwise")
        ) {
          post("runtime-loading", { fixtureName: command.midlet.name });
          launchMidlet(command.midlet);
        }
        if (
          command.type === "manage-game-data"
          && (command.action === "clear" || command.action === "remove")
          && /^[a-f0-9]{64}$/.test(command.identity)
          && typeof command.requestId === "string"
        ) {
          manageGameData(command);
        }
        if (command.type === "restart" && fixture) {
          post("restarting", { fixtureName: fixture.name });
          if (launchKind === "midlet" && midlet) {
            launchMidlet(midlet);
          } else {
            launchFixture();
          }
        }
        if (command.type === "focus") {
          engine.contentDocument?.querySelector("#display")?.focus();
        }
        if (command.type === "input") {
          launchHadUserInput = true;
          stopResolutionObservation();
          const canvas = engine.contentDocument?.querySelector("#display");
          const type = command.pressed ? "keydown" : "keyup";
          canvas?.dispatchEvent(new KeyboardEvent(type, {
            bubbles: true,
            code: command.code,
            key: command.code,
          }));
        }
        if (command.type === "diagnostics") {
          post("diagnostics", {
            message: "Fixture uses FreeJ2ME-Web with the pinned hosted CheerpJ runtime.",
          });
        }
        if (command.type === "teardown") {
          stopReadinessCheck();
          stopResolutionObservation();
          releaseLaunchUrl();
          dataOperation = null;
          engine.src = "about:blank";
          document.querySelector("#fixture").hidden = true;
        }
      });
    </script>
  </body>
</html>
