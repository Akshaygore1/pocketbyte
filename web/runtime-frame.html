<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Java ME runtime frame</title>
    <style>
      html, body { height: 100%; margin: 0; background: #101820; color: #eef6ff; font-family: system-ui, sans-serif; }
      #fixture { display: grid; grid-template-rows: 1fr auto; height: 100%; text-align: center; }
      #engine { border: 0; height: 100%; width: 100%; }
      #status { margin: 0; padding: 0.5rem; }
    </style>
  </head>
  <body>
    <div id="fixture" hidden>
      <iframe id="engine" title="FreeJ2ME-Web CheerpJ runtime"></iframe>
      <p id="status">Redistributable smoke fixture</p>
    </div>
    <script type="module">
      const SHELL_SOURCE = "handset-shell";
      const FRAME_SOURCE = "freej2me-runtime-frame";
      let session = null;
      let fixture = null;
      let midlet = null;
      let launchKind = null;
      let launchUrl = null;
      let dataOperation = null;
      let readinessTimer = null;
      const post = (type, details = {}) => parent.postMessage({ source: FRAME_SOURCE, session, type, ...details }, location.origin);

      const engine = document.querySelector("#engine");
      const status = document.querySelector("#status");

      window.handsetAudio = {
        initialize() {
          const controls = engine.contentWindow?.handsetAudio;
          if (!controls) {
            return Promise.reject(
              new Error("Audio is still loading. Try again in a moment."),
            );
          }
          return controls.initialize();
        },
        setMuted(muted) {
          engine.contentWindow?.handsetAudio?.setMuted(Boolean(muted));
        },
      };

      const stopReadinessCheck = () => {
        if (readinessTimer !== null) clearInterval(readinessTimer);
        readinessTimer = null;
      };

      const releaseLaunchUrl = () => {
        if (launchUrl) URL.revokeObjectURL(launchUrl);
        launchUrl = null;
      };

      const waitForRenderedLaunch = () => {
        stopReadinessCheck();
        const startedAt = Date.now();
        readinessTimer = setInterval(() => {
          const canvas = engine.contentDocument?.querySelector("#display");
          const pixel = canvas?.getContext("2d")?.getImageData(0, 0, 1, 1).data;
          const renderedCanvas = canvas?.localName === "canvas"
            && canvas.style.display !== "none"
            && canvas.width > 0
            && canvas.height > 0;
          const rendered = launchKind === "fixture"
            ? renderedCanvas
              && pixel?.[0] === 0x17
              && pixel?.[1] === 0x30
              && pixel?.[2] === 0x4a
              && pixel?.[3] === 0xff
            : renderedCanvas;

          if (rendered) {
            stopReadinessCheck();
            engine.setAttribute(
              "aria-label",
              `${fixture.name} rendered`,
            );
            status.textContent = fixture.name;
            post("running", { fixtureName: fixture.name });
          } else if (Date.now() - startedAt > 60_000) {
            stopReadinessCheck();
            post("failed", {
              stage: launchKind === "fixture" ? "launching" : "execution",
              message: `${fixture.name} did not render in time.`,
            });
          }
        }, 100);
      };

      const launchFixture = () => {
        launchKind = "fixture";
        midlet = null;
        document.querySelector("#fixture").hidden = false;
        engine.removeAttribute("aria-label");
        status.textContent = "Loading FreeJ2ME-Web and CheerpJ…";
        engine.src = `/run.html?jar=runtime-smoke.jar&audioFixture=1&fractionScale=1&shellControls=1&launch=${Date.now()}`;
        engine.addEventListener("load", waitForRenderedLaunch, { once: true });
      };

      const launchMidlet = (selectedMidlet) => {
        launchKind = "midlet";
        midlet = selectedMidlet;
        fixture = { name: midlet.name };
        releaseLaunchUrl();
        launchUrl = URL.createObjectURL(
          new Blob([midlet.jarBytes], { type: "application/java-archive" }),
        );
        document.querySelector("#fixture").hidden = false;
        engine.removeAttribute("aria-label");
        status.textContent = `Loading the runtime for ${midlet.name}…`;
        const query = new URLSearchParams({
          launchUrl,
          identity: midlet.identity,
          main: midlet.className,
          name: midlet.name,
          width: String(midlet.resolution.width),
          height: String(midlet.resolution.height),
          muted: midlet.muted ? "1" : "0",
          fractionScale: "1",
          shellControls: "1",
          launch: String(Date.now()),
        });
        engine.src = `/run.html?${query}`;
        engine.addEventListener("load", waitForRenderedLaunch, { once: true });
      };

      const manageGameData = (command) => {
        stopReadinessCheck();
        releaseLaunchUrl();
        launchKind = "data-operation";
        fixture = null;
        midlet = null;
        dataOperation = {
          action: command.action,
          requestId: command.requestId,
        };
        document.querySelector("#fixture").hidden = false;
        engine.removeAttribute("aria-label");
        status.textContent = command.action === "clear"
          ? "Clearing saved progress…"
          : "Removing local game data…";
        const query = new URLSearchParams({
          operation: command.action === "clear" ? "clear-game-data" : "remove-game",
          identity: command.identity,
          requestId: command.requestId,
          launch: String(Date.now()),
        });
        engine.src = `/run.html?${query}`;
      };

      window.addEventListener("message", (event) => {
        if (event.origin !== location.origin || event.source !== engine.contentWindow) return;
        const message = event.data;
        if (!message || message.source !== "freej2me-engine") return;
        if (message.type === "launch-consumed") releaseLaunchUrl();
        if (
          message.type === "operation-complete"
          && dataOperation
          && message.requestId === dataOperation.requestId
        ) {
          post("game-data-operation-complete", {
            requestId: dataOperation.requestId,
          });
          dataOperation = null;
          engine.src = "about:blank";
          document.querySelector("#fixture").hidden = true;
          return;
        }
        if (message.type === "launching") {
          post("launching", { fixtureName: fixture.name });
        }
        if (message.type === "media-warning") {
          post("media-warning", { message: message.message });
        }
        if (message.type === "failed") {
          stopReadinessCheck();
          if (dataOperation) {
            post("game-data-operation-failed", {
              requestId: dataOperation.requestId,
              message: message.message,
            });
            dataOperation = null;
            engine.src = "about:blank";
            document.querySelector("#fixture").hidden = true;
            return;
          }
          post("failed", { stage: message.stage, message: message.message });
        }
      });

      window.addEventListener("message", (event) => {
        if (event.origin !== location.origin || event.source !== parent) return;
        const command = event.data;
        if (!command || command.source !== SHELL_SOURCE || typeof command.session !== "string") return;
        session = command.session;
        if (command.type === "initialize") post("runtime-ready");
        if (command.type === "launch" && command.fixture?.id === "smoke-fixture") {
          fixture = command.fixture;
          post("launching", { fixtureName: fixture.name });
          launchFixture();
        }
        if (
          command.type === "launch-midlet"
          && command.midlet?.jarBytes
          && typeof command.midlet.identity === "string"
          && typeof command.midlet.name === "string"
          && typeof command.midlet.className === "string"
          && Number.isInteger(command.midlet.resolution?.width)
          && Number.isInteger(command.midlet.resolution?.height)
        ) {
          post("runtime-loading", { fixtureName: command.midlet.name });
          launchMidlet(command.midlet);
        }
        if (
          command.type === "manage-game-data"
          && (command.action === "clear" || command.action === "remove")
          && /^[a-f0-9]{64}$/.test(command.identity)
          && typeof command.requestId === "string"
        ) {
          manageGameData(command);
        }
        if (command.type === "restart" && fixture) {
          post("restarting", { fixtureName: fixture.name });
          if (launchKind === "midlet" && midlet) {
            launchMidlet(midlet);
          } else {
            launchFixture();
          }
        }
        if (command.type === "focus") {
          engine.contentDocument?.querySelector("#display")?.focus();
        }
        if (command.type === "input") {
          const canvas = engine.contentDocument?.querySelector("#display");
          const type = command.pressed ? "keydown" : "keyup";
          canvas?.dispatchEvent(new KeyboardEvent(type, {
            bubbles: true,
            code: command.code,
            key: command.code,
          }));
        }
        if (command.type === "diagnostics") {
          post("diagnostics", {
            message: "Fixture uses FreeJ2ME-Web with the pinned hosted CheerpJ runtime.",
          });
        }
        if (command.type === "teardown") {
          stopReadinessCheck();
          releaseLaunchUrl();
          dataOperation = null;
          engine.src = "about:blank";
          document.querySelector("#fixture").hidden = true;
        }
      });
    </script>
  </body>
</html>
